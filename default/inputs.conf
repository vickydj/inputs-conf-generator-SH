# Both inputs ship disabled. The setup page enables them once the DS is configured.
# passAuth hands the script a session key so it can read the DS token from
# storage/passwords. Output goes to the default index; set "index" in local/ to change it.

[script://$SPLUNK_HOME/etc/apps/input_conf_generator_sh/bin/request_reload_srv_class.py]
disabled = true
interval = */30 * * * *
passAuth = splunk-system-user
python.version = python3
python.required = 3.13, 3.14
sourcetype = input_conf_generator:status

[script://$SPLUNK_HOME/etc/apps/input_conf_generator_sh/bin/ds_connection_test.py]
disabled = true
interval = */5 * * * *
passAuth = splunk-system-user
python.version = python3
python.required = 3.13, 3.14
sourcetype = input_conf_generator:status
