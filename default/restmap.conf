# POST /services/input_conf_generator/send   (used by the dashboard and | sendpayload)
[script:input_conf_generator_send]
match = /input_conf_generator/send
script = send_payload_handler.py
scripttype = persist
handler = send_payload_handler.SendPayloadHandler
requireAuthentication = true
capability = input_conf_generator_send
output_modes = json
passPayload = true
passHttpHeaders = false
passHttpCookies = false
# The handler needs the system session key to read the DS token from storage/passwords.
passSystemAuth = true
python.version = python3
python.required = 3.9, 3.13
