# Internal log files written by the app's scripts ($SPLUNK_HOME/var/log/splunk)
[source::...input_conf_generator*.log]
sourcetype = input_conf_generator

[input_conf_generator]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 25

# key="value" status events printed by the scripted inputs
[input_conf_generator:status]
SHOULD_LINEMERGE = false
DATETIME_CONFIG = CURRENT
KV_MODE = auto
